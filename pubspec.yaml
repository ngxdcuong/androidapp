name: smart_expense_manager

description: "Expense Manager Flutter App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Date & Currency Format
  intl: ^0.19.0

  # Charts
  fl_chart: ^1.2.0

  # Generate unique id
  uuid: ^4.3.3

  # Local Storage
  shared_preferences: ^2.5.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
